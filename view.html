<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preload" href="fonts/WantedSansVariable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="style.css?v=20261025j"><title>게시글 · 태화여자고등학교</title></head><body>
<div id="hd"></div>
<section class="sv-top"><div class="wrap"><h1>알림마당</h1></div></section>
<div class="crumb"><div class="wrap"><span>홈</span><span>›</span><span>알림마당</span><span>›</span><b id="bc">공지사항</b></div></div>
<div class="wrap sv"><aside class="lnb" id="lnb"></aside><section><div class="bv-head"><h3 id="vt"></h3><div class="bv-meta" id="vm"></div></div><div class="bv-body" id="vb"></div><div class="bv-nav" id="vn"></div><div class="btns"><a class="btn" id="vl" href="notice.html">목록</a></div></section></div>
<div id="ft"></div>
<script src="config.js?v=20261025j"></script><script src="app.js?v=20261025j"></script><script src="notices.js?v=20261025j"></script><script src="layout.js?v=20261025j"></script>
<script>function render(){
  const id=(location.hash||'#n1').slice(1); const all=NOTICES.concat(LETTERS); const n=all.find(x=>x.id===id)||NOTICES[0];
  const isL=n.id[0]==='l'; const arr=isL?LETTERS:NOTICES; const i=arr.indexOf(n);
  mount({sec:"알림마당",active:isL?"가정통신문":"공지사항"});
  document.getElementById('bc').textContent=isL?'가정통신문':'공지사항';
  document.getElementById('vt').textContent=n.t;
  document.getElementById('vm').innerHTML='<span><b>작성자</b>'+n.w+'</span><span><b>작성일</b>'+n.d+'</span><span><b>조회</b>'+n.h+'</span>';
  document.getElementById('vb').innerHTML=(n.body||[]).map(p=>'<p>'+p+'</p>').join('');
  const pv=arr[i-1], nx=arr[i+1];
  const lk=x=>x.link||('view.html#'+x.id);
  document.getElementById('vn').innerHTML='<div><b>이전글</b>'+(pv?'<a href="'+lk(pv)+'">'+pv.t+'</a>':'<span class="muted">이전글이 없습니다.</span>')+'</div><div><b>다음글</b>'+(nx?'<a href="'+lk(nx)+'">'+nx.t+'</a>':'<span class="muted">다음글이 없습니다.</span>')+'</div>';
  document.getElementById('vl').href=isL?'letters.html':'notice.html';
}
render(); window.addEventListener('hashchange',()=>location.reload());</script>
</body></html>
