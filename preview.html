<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="preload" href="fonts/WantedSansVariable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="style.css?v=20261026f"><title>카드 미리보기 · 태화여자고등학교</title></head><body>
<div id="hd"></div>
<section class="sv-top"><div class="wrap"><h1>회원 서비스</h1></div></section>
<div class="crumb"><div class="wrap"><span>홈</span><span>›</span><b>회원가입</b></div></div>
<div class="wrap sv one"><section class="pg"><div id="app"></div></section></div>
<div id="ft"></div>
<script src="config.js?v=20261026f"></script><script src="app.js?v=20261026f"></script><script src="layout.js?v=20261026f"></script>
<script>
// 교무실 전용 미리보기: 회원가입의 '생존자 파일 선택' 화면과 같은 틀로 카드만 보여 준다. 눌러도 아무것도 저장되지 않는다
mount({});
const $ = id => document.getElementById(id), app = $('app'), LETTERS = "ABCDE";
let pw = ""; try { pw = sessionStorage.getItem('th_pw') || ""; } catch(e){}
let list = [], mode = 'all';
function render(){
  // 예시: all = 모두 고를 수 있음 / mix = A 고를 수 있음, B·C·E 흐림, D 이미 선택됨
  const st = i => mode === 'all' ? 'ok' : i === 0 ? 'ok' : i === 3 ? 'taken' : 'dim';
  app.innerHTML = `<div class="note">교무실 전용 미리보기입니다. 참가자에게는 보이지 않고, 눌러도 저장되지 않습니다.
    <br><a href="#" data-m="all" style="text-decoration:underline">${mode === 'all' ? '<b>모두 선택 가능</b>' : '모두 선택 가능'}</a> · <a href="#" data-m="mix" style="text-decoration:underline">${mode === 'mix' ? '<b>흐림·이미 선택됨 예시</b>' : '흐림·이미 선택됨 예시'}</a></div>
  <h2 class="ttl">생존자 파일 선택</h2>
  <p class="desc">선택할 수 있는 파일 중 한 장을 고르세요. 고른 뒤에는 바꿀 수 없습니다.</p>
  <div class="tst-cards">${list.map((c, i) => `<button type="button" class="tst-card${st(i) === 'ok' ? '' : ' off'}${st(i) === 'taken' ? ' taken' : ''}" style="--c:${esc(c.color)}"${st(i) === 'ok' ? '' : ' disabled'}>
    <span class="lt">${LETTERS[i]}</span><span class="chip"></span><span class="ln">“${esc(c.line)}”</span>${st(i) === 'taken' ? '<span class="tk">이미 선택된 파일입니다.</span>' : ''}</button>`).join('')}</div>
  <p class="tst-rf"><button type="button">새로고침</button></p>
  <p class="small muted" id="fit"></p>`;
  app.querySelectorAll('[data-m]').forEach(a => a.onclick = e => { e.preventDefault(); e.stopPropagation(); mode = a.dataset.m; render(); });
  app.querySelectorAll('.tst-card:not(.off), .tst-rf button').forEach(b => b.onclick = () => toast('미리보기에서는 저장되지 않습니다.'));
  // 문장이 잘렸는지(…) 확인해서 알려 준다
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    const cut = [...app.querySelectorAll('.tst-card .ln')].map((el, i) => el.scrollWidth > el.clientWidth + 1 ? LETTERS[i] : '').filter(Boolean);
    const fs = getComputedStyle(app.querySelector('.tst-card .ln')).fontSize;
    $('fit').textContent = `화면 폭 ${window.innerWidth}px · 문장 글자 크기 ${parseFloat(fs).toFixed(1)}px · ` + (cut.length ? `잘린 문장: ${cut.join(', ')}` : '모든 문장이 한 줄에 들어갑니다.');
  });
}
async function load(){
  if(!pw){ app.innerHTML = '<div class="tst-wait"><p>교무실에 로그인한 창에서만 볼 수 있습니다.</p><p><a class="btn" href="office.html">교무실로 가기</a></p></div>'; return; }
  try { list = await rpc('office_test_cards', {p_password: pw}); render(); }
  catch(x){ pw = ""; load(); }
}
load();
window.addEventListener('resize', () => list.length && render());
</script>
</body></html>
